<!DOCTYPE html>
<html>
    <head>
        <title>snake game</title>
        <style>
            body {
                text-align: center;
                font-family: Arial;
                background: #222;
                color: white;
            }
            canvas {
                background: black;
                border:3px solid lime;
            }
        </style>
    </head>
    <body>
        <h1>snake game</h1>
        <p>use arrow keys to move!</p>
        <canvas id="game"
        width="400" height="400"></canvas>
        <h2 id="score">score: 0</h2>
        <script>
            const canvas =
            document.getElementById("game");
            const ctx =
            canvas.getContext("2d");
            let snake = [{x: 200, y:200}];
            let food = {x: 100,y:100};
            let dx = 0, dy = 0;
            let score = 0;
            let running = true;
            document.addEventListener("keydown", e => {
                if (e.key === "ArrowUp"
                    && dy === 0) {
                        dx = 0; dy = -20;
                    }
                if (e.key === "ArrowDown"
                && dy === 0) {
                    dx = 0; dy = 20;
            }
            if (e.key === "ArrowLeft"
                && dx === 0) {
                    dx = -20; dy = 0;
                }
                if (e.key ===
                "ArrowRight" && dx === 0) {
                    dx = 20; dy = 0;
                }
            });
            function draw() {
                if (!running) return;
                let head = {
                    x: snake[0].x + dx,
                    y: snake[0].y + dy
            };
            if (head.x < 0 || head.x
               >= 400 ||
               head.y < 0 || head.y
               >=400 ||
               snake.slice(1).some(s => s.x
                ===
              head .x && s.y ===
              head.y)) {
                running = false;
                document.getelementById("score").textContext
                = "game over score: " +
                 score + " - Refresh to restart";
                return;
              }
              snake.unshift(head);
              if (head.x === food.x &&
                head.y === food.y) {
                    score++;
                    document.getElementById("score").
                    textContent ="Score: " + score;
                    food = {
                        x:
                        Math.floor(Math.random() *
                        20) * 20,
                        y:
                        Math.floor(Math.random() *
                        20) * 20
                    };
                } else {
                    snake.pop();
                }
                ctx.clearRect(0, 0, 400, 400);
                ctx.fillStyle = "red";
                ctx.fillRect(food.x,
                    food.y, 20, 20);
                    ctx.fillStyle = "lime";
                    snake.forEach(s =>
                    ctx.fillRect(s.x, s.y, 18, 18));
            }
            setInterval(draw, 130);
             </script>
    </body>
</html>
